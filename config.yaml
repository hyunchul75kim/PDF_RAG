# PDF RAG 시스템 설정 파일

# 모델 설정
models:
  llm: "llama3"                    # LLM 모델명
  embedding: "mxbai-embed-large"    # 임베딩 모델명

# 텍스트 분할 설정
text_splitter:
  chunk_size: 1000                 # 청크 크기
  chunk_overlap: 200               # 청크 겹침 크기

# 검색 설정
retrieval:
  top_k: 4                         # 검색할 문서 수
  score_threshold: 0.0             # 유사도 임계값 (0.0 ~ 1.0)

# 경로 설정
paths:
  pdf_directory: "pdfs"            # PDF 파일 저장 디렉토리
  vector_stores_directory: "vector_stores"  # 벡터 저장소 디렉토리

# 시스템 프롬프트
system_prompt: "You are a helpful assistant. Read the PDF content and answer the question. Translate the answer in Korean with emoji."

